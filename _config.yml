title: Interstellar
description: >-
  IBC v2 (Eureka) for Stellar — on-chain light-client verification of consensus,
  with no bridge operator, custodian or attestation service in the trust path.

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  toc_levels: 2..3

plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - .github
